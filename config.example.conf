# Claude Converse configuration  —  HOCON
# ---------------------------------------------------------------------------
# This is the reference config. On first run Converse copies it to your
# private config file (created mode 0600):
#     ~/.config/claude-converse/config.conf   (honors XDG_CONFIG_HOME)
# Edit THAT copy — not this file — then restart Claude /converse or run
# Pi /reload. (Editing this file only affects config.conf created later.)
#
# HOW TO SWITCH PROVIDERS
#   Pick exactly ONE speech-to-text provider and ONE text-to-speech provider
#   by moving the uncommented `provider = "..."` line. Each provider has its
#   own block with optional overrides and a PREREQ note listing what it needs.
#   Blocks for providers you are NOT using are ignored, so leave them in place
#   — you never have to comment a provider block out, only the `provider` line.
#
# Everything below `provider` is optional: choosing a provider selects sane
# defaults (URL, model, voice). Uncomment a field only to override a default.
# ---------------------------------------------------------------------------


# ===========================================================================
# SPEECH TO TEXT   (choose one provider)
# ===========================================================================
stt {
  provider = "whisper.cpp"
  # provider = "speaches"
  # provider = "moonshine"
  # provider = "groq"
  # provider = "openai"

  # --- whisper.cpp — local, GPU-light, no API key. Default STT. -----------
  # PREREQ: an OpenAI-compatible whisper.cpp server on localhost:2022, e.g.
  #   whisper-server -m models/ggml-base.en.bin --host 127.0.0.1 --port 2022
  # For better programming accuracy, swap in a small English model.
  whisper.cpp {
    model = "base.en"
    # model = "small.en-q5_0"
  }

  # --- speaches — local Faster-Whisper via an OpenAI-compatible server. ----
  # PREREQ: run Speaches on :8000 and download the model once:
  #   docker run --rm -d -p 8000:8000 --name speaches ghcr.io/speaches-ai/speaches:latest-cpu
  #   SPEACHES_BASE_URL=http://localhost:8000 \
  #     uvx speaches-cli model download Systran/faster-distil-whisper-small.en
  # apiKey is optional and only for a loopback server with auth enabled.
  speaches {
    model = "Systran/faster-distil-whisper-small.en"
    # apiKey = "..."
  }

  # --- groq — HOSTED, fast and cheap (~$0.04/transcribed hour). ------------
  # PREREQ: a free API key from https://console.groq.com — paste it below.
  groq {
    # apiKey = "gsk_..."
    prompt = "Programming and software-development vocabulary"
  }

  # --- openai — HOSTED. -----------------------------------------------------
  # PREREQ: an OpenAI API key with audio access — paste it below.
  openai {
    # apiKey = "sk-..."
  }
}

# Moonshine is on-device STT (its settings live here, not in an stt sub-block).
# To use it: set stt.provider = "moonshine" above.
# PREREQ: install the official package into the interpreter below:
#   python3 -m pip install moonshine-voice
moonshine {
  pythonCommand = "python3"
  language = "en"
  model = "small-streaming"
}


# ===========================================================================
# TEXT TO SPEECH   (choose one provider)
# ===========================================================================
tts {
  provider = "kokoro"
  # provider = "speaches-kokoro"
  # provider = "piper"
  # provider = "pocket-tts"
  # provider = "openai"

  # --- kokoro — local, natural voices, no API key. Default TTS. ------------
  # PREREQ: a Kokoro-compatible server on localhost:8880 (e.g. Kokoro-FastAPI).
  kokoro {
    voice = "af_heart"
    # model = "kokoro"
  }

  # --- speaches-kokoro — Kokoro voices via Speaches ONNX (CPU, no GPU). -----
  # PREREQ: run Speaches on :8000 and download the ONNX model once:
  #   docker run --rm -d -p 8000:8000 --name speaches ghcr.io/speaches-ai/speaches:latest-cpu
  #   SPEACHES_BASE_URL=http://localhost:8000 \
  #     uvx speaches-cli model download speaches-ai/Kokoro-82M-v1.0-ONNX
  # Speaches Kokoro accepts speed 0.5–2.0.
  speaches-kokoro {
    voice = "af_heart"
    # speed = 1.25
    # apiKey = "..."   # only for a loopback server with auth enabled
  }

  # --- piper — lightweight, very CPU-efficient, more synthetic prosody. -----
  # PREREQ: run Speaches on :8000 and download the Piper voice once:
  #   SPEACHES_BASE_URL=http://localhost:8000 \
  #     uvx speaches-cli model download speaches-ai/piper-en_US-lessac-medium
  piper {
    voice = "lessac"
    # apiKey = "..."   # only for a loopback server with auth enabled
  }

  # --- pocket-tts — official Kyutai server, low-latency CPU speech. --------
  # PREREQ: run the official server on loopback:
  #   uvx pocket-tts serve --host localhost --port 8000 --quantize
  # The official /tts API has no key, model, or speed field.
  pocket-tts {
    voice = "alba"
  }

  # --- openai — HOSTED. -----------------------------------------------------
  # PREREQ: an OpenAI API key with audio access — paste it below.
  openai {
    # apiKey = "sk-..."
    voice = "alloy"
    # speed = 1.25
  }
}


